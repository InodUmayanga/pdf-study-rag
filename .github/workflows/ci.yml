name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff==0.14.5 pytest==8.4.2 python-dotenv==1.2.3

      - name: Lint
        run: ruff check .

      - name: Check files compile
        run: >-
          python -m compileall -q
          app.py ingest.py config.py prompts.py rag.py utils.py evals tests

      - name: Unit tests (eval excluded)
        run: pytest tests/ -v

  # Full pipeline on the generated fixture: OCR -> embeddings -> ChromaDB ->
  # retrieval. Offline (no Groq key); gated on hit@3 in tests/test_eval.py.
  eval:
    needs: lint
    runs-on: ubuntu-latest
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config.py') }}

      - name: Install (CPU-only torch, then pinned requirements)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Retrieval evaluation
        run: pytest -m eval tests/test_eval.py -v -s

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results*.json
          if-no-files-found: ignore
