name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install ruff==0.14.5

      - name: Lint
        run: ruff check .

      - name: Check files compile
        run: python -m compileall -q app.py ingest.py config.py
