[project]
name = "pdf-study-rag"
version = "0.1.0"
description = "Chat with your PDF study materials — local RAG with page-level citations"
requires-python = ">=3.10"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# warnings.filterwarnings must run before heavy imports
"app.py" = ["E402"]
"ingest.py" = ["E402"]
"evals/run_eval.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: end-to-end retrieval evaluation (needs the full requirements and downloads the embedding model)",
]
# The eval test is opt-in: `pytest -m eval tests/test_eval.py -v -s`
addopts = "-m 'not eval'"
